server {
    listen 80;
    server_name almarkaz.skoolific.com;

    # Root directory for frontend
    root /var/www/almarkaz.skoolific.com/APP/dist;
    index index.html;

    # Increase client body size for file uploads
    client_max_body_size 50M;

    # API proxy to backend
    location /api/ {
        proxy_pass http://localhost:5052/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Socket.IO WebSocket support
    location /socket.io/ {
        proxy_pass http://localhost:5052/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Serve uploaded files
    location /uploads/ {
        alias /var/www/almarkaz.skoolific.com/backend/Uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /Uploads/ {
        alias /var/www/almarkaz.skoolific.com/backend/Uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend - serve static files
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logging
    access_log /var/log/nginx/almarkaz.skoolific.com.access.log;
    error_log /var/log/nginx/almarkaz.skoolific.com.error.log;
}
