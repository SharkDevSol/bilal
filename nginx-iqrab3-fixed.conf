# Upstream backend server - Port 5000 (skoolific-backend)
upstream iqrab3_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name iqrab3.skoolific.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iqrab3.skoolific.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/iqrab3.skoolific.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iqrab3.skoolific.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/iqrab3-school;
    index index.html;

    # Increase upload size limit to 50MB
    client_max_body_size 50M;

    # Increase timeouts for large uploads
    client_body_timeout 120s;
    client_header_timeout 120s;
    send_timeout 120s;

    # Fix double API prefix issue (temporary workaround for cached frontend)
    location ~ ^/api/api/(.*)$ {
        return 301 /api/$1$is_args$args;
    }

    # All API requests - Port 5000 (skoolific-backend)
    # IMPORTANT: No trailing slash to preserve the full path including /api
    location /api {
        proxy_pass http://iqrab3_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased timeouts for uploads
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;

        # Upload size for this location
        client_max_body_size 50M;
    }

    # Frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}