# Add this to your Nginx configuration for iqrab3.skoolific.com
# Location: /etc/nginx/sites-available/iqrab3.skoolific.com

# Inside the server block, add this location block:

location ~* \.(js|css|html)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
}

# This will force browsers to NEVER cache JavaScript, CSS, or HTML files
