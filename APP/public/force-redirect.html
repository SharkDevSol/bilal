<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cache Bypass - Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Bypassing Cache...</h1>
        <div class="spinner"></div>
        <p>Forcing fresh load with cache busting...</p>
        <p id="countdown">Redirecting in 3 seconds...</p>
    </div>

    <script>
        // Clear everything possible
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(registration => registration.unregister());
            });
        }
        
        if ('caches' in window) {
            caches.keys().then(names => {
                names.forEach(name => caches.delete(name));
            });
        }
        
        localStorage.clear();
        sessionStorage.clear();
        
        // Countdown and redirect
        let count = 3;
        const countdown = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            count--;
            countdown.textContent = `Redirecting in ${count} seconds...`;
            
            if (count <= 0) {
                clearInterval(timer);
                
                // Multiple redirect strategies
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(7);
                
                // Try to break cache with multiple parameters
                const url = new URL(window.location.origin);
                url.searchParams.set('_t', timestamp);
                url.searchParams.set('_r', random);
                url.searchParams.set('_cache', 'bypass');
                url.searchParams.set('_v', '1778137369320');
                
                // Force redirect
                window.location.replace(url.toString());
            }
        }, 1000);
    </script>
</body>
</html>
